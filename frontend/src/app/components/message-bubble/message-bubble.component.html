<article class="message" [class.from-user]="message().role === 'user'">
  <div class="bubble">
    @if (message().content) {
      <!-- Kept on one line: the text keeps its line breaks, so extra spaces here would show. -->
      <p class="text">{{ message().content }}@if (message().status === 'streaming') {<span class="cursor" aria-hidden="true"></span>}</p>
    } @else if (message().status === 'streaming') {
      <span class="typing" aria-label="Writing a reply"><span></span><span></span><span></span></span>
    }
  </div>

  @if (message().status === 'error') {
    <p class="meta meta-error" role="alert">{{ message().error }}</p>
  } @else if (message().status === 'stopped') {
    <p class="meta">Stopped</p>
  }
</article>
