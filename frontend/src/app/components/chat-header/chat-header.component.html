<header class="chat-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>ChatBox</h1>
  </div>

  <div class="controls">
    <!-- The model dropdown. Models without an API key are listed but can't be picked. -->
    <select
      #picker
      class="model-select"
      aria-label="Model"
      [disabled]="store.isStreaming() || store.models().length === 0"
      (change)="store.selectModel(picker.value)"
    >
      @for (model of store.models(); track model.id) {
        <option
          [value]="model.id"
          [selected]="model.id === store.selectedModelId()"
          [disabled]="!model.available"
        >
          {{ model.label }}{{ model.available ? '' : ' (no API key)' }}
        </option>
      }
    </select>

    <button
      type="button"
      class="button-ghost"
      (click)="store.clearChat()"
      [disabled]="store.messages().length === 0"
    >
      New chat
    </button>
  </div>
</header>
